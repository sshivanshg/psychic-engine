name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src/tradeos

      - name: Tests (pytest)
        # DB-backed integration tests skip automatically when no Postgres is present;
        # the pure-function unit tests (risk math, indicators, fundamentals, chunking, eval) run.
        run: uv run pytest -q
